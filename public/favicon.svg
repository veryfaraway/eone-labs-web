<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Circular container with crisp edge -->
  <circle cx="50" cy="50" r="46" fill="#111218"/>
  <circle cx="50" cy="50" r="45" stroke="#2b2e3c" stroke-width="2"/>
  
  <!-- Dynamic spinner orbital accent -->
  <circle cx="50" cy="50" r="39" stroke="#ffffff" stroke-width="2.5" stroke-dasharray="65 180" stroke-linecap="round" opacity="0.85" transform="rotate(-60 50 50)"/>
  <circle cx="50" cy="50" r="39" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="25 220" stroke-linecap="round" opacity="0.4" transform="rotate(110 50 50)"/>

  <!-- Tilted rotating lowercase e glyph -->
  <g transform="rotate(-22 50 50)">
    <path d="M 33 50 L 67 50 A 17 17 0 1 0 62 62" stroke="#ffffff" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>